; SecureEncrypt web page texts - language: Nederlands (file name = language code: nl.ini)
; To add a language: copy en.ini to <code>.ini here (src\web\web_lang), translate the values, run src\build.ps1.
; One "key = value" per line, UTF-8. Missing keys fall back to English (the build prints a warning).
; Keep the {0} {1} placeholders, the [[SE]] link token and the HTML tags (<b>, <br>, <a ...>) as they are.
; strength = five words separated by |  (from very weak to strong).

lang_name = Nederlands
sub = AES-256-versleuteling en -ontsleuteling in uw browser
priv = <b>Er verlaat niets uw apparaat.</b> Bestanden en wachtwoorden worden lokaal op deze pagina verwerkt; er worden geen gegevens geüpload.
tab_enc = Versleutelen
tab_dec = Ontsleutelen
drop_enc = Sleep bestanden of mappen hierheen
add_files = Bestanden toevoegen...
add_dir = Map toevoegen...
clear = Wissen
pw = Wachtwoord (optioneel)
pw2 = Wachtwoord herhalen
pw_hint = Zonder wachtwoord wordt de inhoud alleen verhuld (compressie + XOR); dit is GEEN beveiliging en verbergt alleen platte tekst.
kf = Sleutelbestand (optioneel)
kf_pick = Sleutelbestand kiezen...
kf_hint = Een sleutelbestand kan in plaats van een wachtwoord of samen ermee (twee factoren) worden gebruikt. De inhoud telt, niet de naam.
btn_enc = Versleutelen
btn_dec = Ontsleutelen
strength = Zeer zwak | Zwak | Redelijk | Goed | Sterk
drop_dec = Sleep hier een *_decrypt.cmd-bestand heen
pick_dec = *_decrypt.cmd kiezen...
pw_dec = Wachtwoord
kf_dec = Sleutelbestand
empty = Voeg eerst ten minste één bestand of map toe.
mismatch = De twee wachtwoorden zijn niet hetzelfde.
nopw_confirm = Geen wachtwoord en geen sleutelbestand: de inhoud wordt alleen verhuld (niet veilig). Doorgaan?
limit_enc = Groottebeperking: de totale grootte van de bestanden en mappen die u op deze pagina toevoegt, mag ongeveer 1,5 GB bedragen. Gebruik voor grotere gegevens de [[SE]]-applicatie voor Windows. Of open deze pagina in Chrome, Edge, Opera of Samsung Internet, die een modus voor grote bestanden hebben.
limit_dec = Groottebeperking: het bestand *_decrypt.cmd mag op deze pagina maximaal ongeveer 1,5 GB groot zijn. Gebruik voor grotere bestanden de [[SE]]-applicatie voor Windows. Of open deze pagina in Chrome, Edge, Opera of Samsung Internet, die een modus voor grote bestanden hebben.
too_big = Dit bestand is te groot voor de browser (totale limiet ongeveer 1,5 GB). Deze browser ondersteunt de modus voor grote bestanden niet: open deze pagina in Chrome, Edge, Opera of Samsung Internet, of gebruik de [[SE]]-applicatie voor Windows.
too_big_dec = Dit bestand is te groot voor de browser (limiet ongeveer 1,5 GB). Deze browser ondersteunt de modus voor grote bestanden niet: u kunt deze pagina openen in Chrome, Edge, Opera of Samsung Internet. Of ontsleutel het met [[SE]] in Windows: klik met de rechtermuisknop en kies „Ontsleutelen”, of selecteer het op het tabblad Ontsleutelen van SecureEncrypt.
elapsed = Tijd: {0}
unit_h = u
unit_m = min
unit_s = sec
no_stream = Deze browser heeft geen compressie-API (CompressionStream). Gebruik een actuele versie van Chrome, Edge, Firefox of Safari.
no_crypto = De cryptografie-API van de browser is niet beschikbaar. Open deze pagina via HTTPS (of als lokaal bestand) in een actuele browser.
home = Startpagina
insecure = Deze pagina is geopend via een onveilige verbinding (onversleuteld http://), daarom heeft de browser versleutelen en ontsleutelen uitgeschakeld. Open de pagina via https://, als http://localhost of als lokaal bestand.
dir_hint = Wanneer u een map kiest, kan de browser toestemming vragen om deze te „uploaden”. Uw bestanden worden NIET geüpload: deze toestemming laat de pagina alleen de map lezen en de bestanden op uw apparaat versleutelen.
skipped = NIET opgenomen (kon niet worden gelezen; een gesleepte map die de browser niet doorgeeft, kan worden toegevoegd met „Map toevoegen...”): {0}
err_noread = Geen enkel item kon worden gelezen. Gebruik voor een map „Map toevoegen...” in plaats van deze te slepen.
working = Bezig... (het afleiden van de sleutel kan even duren)
enc_done = Voltooid: {0} item(s), {1} -> {2}. Modus: {3}.
mode_aes = AES-256-CBC + HMAC-SHA256
mode_xor = alleen verhulling (zonder wachtwoord)
enc_note = Het bestand kan in Windows met een dubbelklik worden gestart (een venster vraagt om het wachtwoord) en kan op elk apparaat met deze pagina worden geopend.
keep_open = Sluit de browser of dit tabblad niet en laad de pagina niet opnieuw terwijl de bewerking loopt; die zou worden onderbroken en er kunnen half geschreven bestanden achterblijven.
enc_note_mid = Het bestand kan in Windows met een dubbelklik worden gestart (een venster vraagt om het wachtwoord). Omdat het groter is dan 1,5 GB, kan deze pagina het alleen openen met de modus voor grote bestanden in Chrome, Edge, Opera of Samsung Internet.
enc_note_big = LET OP: het bestand is groter dan 4 GB; Windows kan het niet met een dubbelklik openen. Klik om het te ontsleutelen met de rechtermuisknop op het bestand en kies „Ontsleutelen”, of selecteer het op het tabblad Ontsleutelen van het SecureEncrypt-venster. Deze pagina kan het ook openen met de modus voor grote bestanden in Chrome, Edge, Opera of Samsung Internet.
dl = Downloaden
dl_all = Alles downloaden (ZIP)
sanitized = In {0} naam/namen stonden tekens die Windows niet toestaat; deze zijn gewijzigd.
dec_info_aes = Versleuteld met AES-256 ({0} iteraties).
dec_info_xor = Geen wachtwoord: de inhoud is alleen verhuld.
dec_need_kf = Voor dit bestand is een sleutelbestand nodig.
dec_need_pw = Voor dit bestand is een wachtwoord nodig.
dec_ok = Ontsleuteld: {0} bestand(en), {1}. Integriteitscontrole geslaagd.
dec_ok_bad = Ontsleuteld, maar de integriteitscontrole (SHA-256) is MISLUKT. De inhoud kan beschadigd of gewijzigd zijn.
err_wrongpw = Onjuist wachtwoord of sleutelbestand.
err_mac = Het bestand is beschadigd of gewijzigd (authenticatie mislukt). Er is niets ontsleuteld.
err_format = Dit is geen geldig SecureEncrypt-bestand (of het is beschadigd).
err_path = Het bestand bevat een onveilig pad en is geweigerd.
err_needpw = Voer het wachtwoord in (en/of kies het sleutelbestand).
err_mem = Onvoldoende geheugen in de browser voor dit bestand.
err_other = Fout: {0}
about = Deze toepassing is geprogrammeerd door Abdullah ERTÜRK.<br><a href="https://buymeacoffee.com/abdullaherturk" target="_blank" rel="noopener noreferrer">Koop een kop koffie voor mij</a>
foot = Open source. Compatibel met SecureEncrypt voor Windows (SEv2-indeling).
items = items
; large file mode (written straight to disk, piece by piece)
limit_enc_big = Grote bestanden: bestanden en mappen van meer dan 1,5 GB worden stukje voor stukje verwerkt en direct opgeslagen in een bestand dat u kiest; het geheugen is geen beperking. Zonder wachtwoord of sleutelbestand wordt de inhoud alleen verborgen, niet beschermd.
limit_dec_big = Grote bestanden: een _decrypt.cmd-bestand van meer dan 1,5 GB wordt stukje voor stukje ontsleuteld en direct weggeschreven in een map die u kiest (bestaande bestanden worden niet overschreven; aan de naam van het nieuwe bestand wordt een nummer toegevoegd).
big_dir_hint = Vanwege een browserregel kunnen de mappen Bureaublad, Downloads en Documenten zelf niet worden gekozen; maak daarin met „Nieuwe map” een map aan en kies die, of kies een bestaande map.
big_on = Modus voor grote bestanden: het resultaat wordt direct op schijf opgeslagen, dus u wordt gevraagd waar het moet komen. Zonder wachtwoord of sleutelbestand wordt de inhoud alleen verborgen, niet beschermd.
big_s1_enc = Stap 1/2: gegevens lezen... {0}%
big_s2_enc = Stap 2/2: versleutelen en opslaan... {0}%
big_s1_dec = Stap 1/2: bestand controleren... {0}%
big_s2_dec = Stap 2/2: ontsleutelen en opslaan... {0}%
big_one_dec = Bestanden herstellen... {0}%
cancel = Annuleren
big_cancelled = Geannuleerd.
big_changed = Een bestand is tijdens de verwerking gewijzigd (of kon niet volledig worden gelezen). Er is niets opgeslagen.
big_saved = Opgeslagen als: {0}
big_saved_dir = De bestanden zijn weggeschreven naar de map: {0}
