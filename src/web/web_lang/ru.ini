; SecureEncrypt web page texts - language: Русский (file name = language code: ru.ini)
; To add a language: copy en.ini to <code>.ini here (src\web\web_lang), translate the values, run src\build.ps1.
; One "key = value" per line, UTF-8. Missing keys fall back to English (the build prints a warning).
; Keep the {0} {1} placeholders, the [[SE]] link token and the HTML tags (<b>, <br>, <a ...>) as they are.
; strength = five words separated by |  (from very weak to strong).

lang_name = Русский
sub = Шифрование и расшифровка AES-256 в браузере
priv = <b>Данные не покидают ваше устройство.</b> Файлы и пароли обрабатываются локально на этой странице; данные никуда не загружаются.
tab_enc = Зашифровать
tab_dec = Расшифровать
drop_enc = Перетащите сюда файлы или папки
add_files = Добавить файлы...
add_dir = Добавить папку...
clear = Очистить
pw = Пароль (необязательно)
pw2 = Повторите пароль
pw_hint = Без пароля содержимое только маскируется (сжатие + XOR); это НЕ обеспечивает защиту, а лишь скрывает обычный текст.
kf = Файл-ключ (необязательно)
kf_pick = Выбрать файл-ключ...
kf_hint = Файл-ключ можно использовать вместо пароля или вместе с ним (два фактора). Важно содержимое файла, а не его имя.
btn_enc = Зашифровать
btn_dec = Расшифровать
strength = Очень слабый | Слабый | Средний | Хороший | Надёжный
drop_dec = Перетащите сюда файл *_decrypt.cmd
pick_dec = Выбрать *_decrypt.cmd...
pw_dec = Пароль
kf_dec = Файл-ключ
empty = Сначала добавьте хотя бы один файл или папку.
mismatch = Пароли не совпадают.
nopw_confirm = Нет пароля и файла-ключа: содержимое будет только замаскировано (это небезопасно). Продолжить?
limit_enc = Ограничение размера: общий объём добавленных на этой странице файлов и папок — примерно до 1,5 ГБ. Для больших объёмов используйте приложение [[SE]] для Windows. Либо откройте эту страницу в Chrome, Edge, Opera или Samsung Internet — в них есть режим больших файлов.
limit_dec = Ограничение размера: размер файла *_decrypt.cmd на этой странице — примерно до 1,5 ГБ. Для более крупных файлов используйте приложение [[SE]] для Windows. Либо откройте эту страницу в Chrome, Edge, Opera или Samsung Internet — в них есть режим больших файлов.
too_big = Файл слишком велик для браузера (общий предел — около 1,5 ГБ). Этот браузер не поддерживает режим больших файлов: откройте эту страницу в Chrome, Edge, Opera или Samsung Internet либо используйте приложение [[SE]] для Windows.
too_big_dec = Файл слишком велик для браузера (предел — около 1,5 ГБ). Этот браузер не поддерживает режим больших файлов: можно открыть эту страницу в Chrome, Edge, Opera или Samsung Internet. Либо расшифруйте файл с помощью [[SE]] в Windows: щёлкните правой кнопкой мыши и выберите «Расшифровать» либо выберите файл на вкладке расшифровки SecureEncrypt.
elapsed = Время: {0}
unit_h = ч
unit_m = мин
unit_s = с
no_stream = В этом браузере недоступен API сжатия (CompressionStream). Используйте актуальную версию Chrome, Edge, Firefox или Safari.
no_crypto = Криптографический API браузера недоступен. Откройте эту страницу через HTTPS (или как локальный файл) в актуальном браузере.
home = Главная
insecure = Страница открыта через небезопасное соединение (обычный http://), поэтому браузер отключил шифрование и расшифровку. Откройте её через https://, как http://localhost или как локальный файл.
dir_hint = При выборе папки браузер может запросить разрешение на её «загрузку». Файлы НИКУДА не отправляются: разрешение нужно только для чтения папки и шифрования файлов на вашем устройстве.
skipped = НЕ включено (не удалось прочитать; папку, которую браузер не передал при перетаскивании, можно добавить через «Добавить папку...»): {0}
err_noread = Не удалось прочитать ни одного элемента. Для папки используйте «Добавить папку...», а не перетаскивание.
working = Обработка... (вычисление ключа может занять некоторое время)
enc_done = Готово: элементов: {0}, {1} -> {2}. Режим: {3}.
mode_aes = AES-256-CBC + HMAC-SHA256
mode_xor = только маскировка (без пароля)
enc_note = Файл запускается в Windows двойным щелчком (окно запросит пароль) и может быть открыт на любом устройстве с помощью этой страницы.
keep_open = Не закрывайте браузер или эту вкладку и не обновляйте страницу во время работы: операция будет прервана, а недописанные файлы могут остаться.
enc_note_mid = Файл запускается в Windows двойным щелчком (окно запросит пароль). Так как он больше 1,5 ГБ, эта страница может открыть его только в режиме больших файлов в Chrome, Edge, Opera или Samsung Internet.
enc_note_big = ВНИМАНИЕ: файл больше 4 ГБ; Windows не может открыть его двойным щелчком. Чтобы расшифровать, щёлкните файл правой кнопкой мыши и выберите «Расшифровать» либо выберите его на вкладке расшифровки окна SecureEncrypt. Эта страница также может открыть его в режиме больших файлов в Chrome, Edge, Opera или Samsung Internet.
dl = Скачать
dl_all = Скачать всё (ZIP)
sanitized = В {0} имени(ах) были символы, недопустимые в Windows; они заменены.
dec_info_aes = Зашифровано AES-256 (итераций: {0}).
dec_info_xor = Без пароля: содержимое только замаскировано.
dec_need_kf = Для этого файла требуется файл-ключ.
dec_need_pw = Для этого файла требуется пароль.
dec_ok = Расшифровано: файлов: {0}, {1}. Проверка целостности пройдена.
dec_ok_bad = Расшифровано, но проверка целостности (SHA-256) НЕ ПРОЙДЕНА. Содержимое может быть повреждено или изменено.
err_wrongpw = Неверный пароль или файл-ключ.
err_mac = Файл повреждён или изменён (ошибка проверки подлинности). Расшифровка не выполнена.
err_format = Это недопустимый файл SecureEncrypt (или он повреждён).
err_path = Файл содержит небезопасный путь и был отклонён.
err_needpw = Введите пароль (и/или выберите файл-ключ).
err_mem = В браузере недостаточно памяти для этого файла.
err_other = Ошибка: {0}
about = Это приложение разработал Abdullah ERTÜRK.<br><a href="https://buymeacoffee.com/abdullaherturk" target="_blank" rel="noopener noreferrer">Угостить меня кофе</a>
foot = Открытый исходный код. Совместимо с SecureEncrypt для Windows (формат SEv2).
items = элементов
; large file mode (written straight to disk, piece by piece)
limit_enc_big = Большие файлы: файлы и папки размером более 1,5 ГБ обрабатываются по частям и сохраняются прямо в выбранный вами файл; память не ограничивает. Без пароля и файла ключа содержимое лишь скрывается, а не защищается.
limit_dec_big = Большие файлы: файл _decrypt.cmd размером более 1,5 ГБ расшифровывается по частям и записывается прямо в выбранную вами папку (существующие файлы не перезаписываются; к имени нового файла добавляется номер).
big_dir_hint = По правилу браузера нельзя выбрать сами папки «Рабочий стол», «Загрузки» и «Документы»; создайте внутри одной из них папку кнопкой «Новая папка» и выберите её либо выберите уже существующую папку.
big_on = Режим больших файлов: результат сохраняется прямо на диск, поэтому будет предложено выбрать место сохранения. Без пароля и файла ключа содержимое лишь скрывается, а не защищается.
big_s1_enc = Шаг 1/2: чтение данных... {0}%
big_s2_enc = Шаг 2/2: шифрование и сохранение... {0}%
big_s1_dec = Шаг 1/2: проверка файла... {0}%
big_s2_dec = Шаг 2/2: расшифровка и сохранение... {0}%
big_one_dec = Восстановление файлов... {0}%
cancel = Отмена
big_cancelled = Отменено.
big_changed = Файл изменился (или не был прочитан полностью) во время обработки. Ничего не сохранено.
big_saved = Сохранено как: {0}
big_saved_dir = Файлы записаны в папку: {0}
