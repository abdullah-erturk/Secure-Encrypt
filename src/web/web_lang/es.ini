; SecureEncrypt web page texts - language: Español (file name = language code: es.ini)
; To add a language: copy en.ini to <code>.ini here (src\web\web_lang), translate the values, run src\build.ps1.
; One "key = value" per line, UTF-8. Missing keys fall back to English (the build prints a warning).
; Keep the {0} {1} placeholders, the [[SE]] link token and the HTML tags (<b>, <br>, <a ...>) as they are.
; strength = five words separated by |  (from very weak to strong).

lang_name = Español
sub = Cifrado y descifrado AES-256 en su navegador
priv = <b>Nada sale de su dispositivo.</b> Los archivos y las contraseñas se procesan localmente en esta página; no se carga ningún dato.
tab_enc = Cifrar
tab_dec = Descifrar
drop_enc = Suelte aquí archivos o carpetas
add_files = Añadir archivos...
add_dir = Añadir carpeta...
clear = Limpiar
pw = Contraseña (opcional)
pw2 = Repita la contraseña
pw_hint = Sin contraseña, el contenido solo se oculta (compresión + XOR); esto NO es seguridad, solo evita que el texto sin formato sea visible.
kf = Archivo de clave (opcional)
kf_pick = Elegir archivo de clave...
kf_hint = El archivo de clave puede utilizarse en lugar de una contraseña o junto con ella (dos factores). Lo que importa es su contenido, no su nombre.
btn_enc = Cifrar
btn_dec = Descifrar
strength = Muy débil | Débil | Aceptable | Buena | Fuerte
drop_dec = Suelte aquí un archivo *_decrypt.cmd
pick_dec = Elegir *_decrypt.cmd...
pw_dec = Contraseña
kf_dec = Archivo de clave
empty = Añada primero al menos un archivo o una carpeta.
mismatch = Las dos contraseñas no coinciden.
nopw_confirm = No hay contraseña ni archivo de clave: el contenido solo se ocultará (no es seguro). ¿Desea continuar?
limit_enc = Límite de tamaño: el total de archivos y carpetas añadidos en esta página puede ser de aproximadamente 1,5 GB como máximo. Para datos mayores, utilice la aplicación [[SE]] para Windows. O abra esta página en Chrome, Edge, Opera o Samsung Internet, que tienen modo de archivos grandes.
limit_dec = Límite de tamaño: el archivo *_decrypt.cmd puede ocupar como máximo aproximadamente 1,5 GB en esta página. Para archivos mayores, utilice la aplicación [[SE]] para Windows. O abra esta página en Chrome, Edge, Opera o Samsung Internet, que tienen modo de archivos grandes.
too_big = Este archivo es demasiado grande para el navegador (límite total aproximado: 1,5 GB). Este navegador no admite el modo de archivos grandes: abra esta página en Chrome, Edge, Opera o Samsung Internet, o utilice la aplicación [[SE]] para Windows.
too_big_dec = Este archivo es demasiado grande para el navegador (límite aproximado: 1,5 GB). Este navegador no admite el modo de archivos grandes: puede abrir esta página en Chrome, Edge, Opera o Samsung Internet. O descífrelo con [[SE]] en Windows: haga clic derecho y elija «Descifrar», o selecciónelo en la pestaña Descifrar de SecureEncrypt.
elapsed = Tiempo: {0}
unit_h = h
unit_m = min
unit_s = s
no_stream = Este navegador no dispone de la API de compresión (CompressionStream). Utilice una versión actual de Chrome, Edge, Firefox o Safari.
no_crypto = La API criptográfica del navegador no está disponible. Abra esta página mediante HTTPS (o como archivo local) en un navegador actualizado.
home = Inicio
insecure = Esta página se abrió mediante una conexión no segura (http:// sin cifrar), por lo que el navegador ha desactivado el cifrado y el descifrado. Ábrala mediante https://, como http://localhost o como archivo local.
dir_hint = Al elegir una carpeta, el navegador puede pedir permiso para «subirla». Sus archivos NO se suben a ningún sitio: el permiso solo permite que la página lea la carpeta y cifre los archivos en su dispositivo.
skipped = NO incluido (no se pudo leer; una carpeta arrastrada que el navegador no transmite puede añadirse con «Añadir carpeta...»): {0}
err_noread = No se pudo leer ningún elemento. Para una carpeta, utilice «Añadir carpeta...» en lugar de arrastrarla.
working = Procesando... (la derivación de la clave puede tardar un momento)
enc_done = Hecho: {0} elemento(s), {1} -> {2}. Modo: {3}.
mode_aes = AES-256-CBC + HMAC-SHA256
mode_xor = solo ocultación (sin contraseña)
enc_note = El archivo se ejecuta en Windows con un doble clic (una ventana solicita la contraseña) y puede abrirse con esta página en cualquier dispositivo.
keep_open = No cierre el navegador ni esta pestaña ni recargue la página mientras se realiza el proceso; se interrumpiría y podrían quedar archivos a medio escribir.
enc_note_mid = El archivo se ejecuta en Windows con un doble clic (una ventana solicita la contraseña). Como supera los 1,5 GB, esta página solo puede abrirlo con el modo de archivos grandes en Chrome, Edge, Opera u Samsung Internet.
enc_note_big = AVISO: El archivo supera los 4 GB; Windows no puede abrirlo con un doble clic. Para descifrarlo, haga clic derecho en el archivo y elija «Descifrar», o selecciónelo en la pestaña Descifrar de la ventana de SecureEncrypt. Esta página también puede abrirlo con el modo de archivos grandes en Chrome, Edge, Opera u Samsung Internet.
dl = Descargar
dl_all = Descargar todo (ZIP)
sanitized = Se modificaron {0} nombre(s) porque contenían caracteres no permitidos por Windows.
dec_info_aes = Cifrado con AES-256 ({0} iteraciones).
dec_info_xor = Sin contraseña: el contenido solo está oculto.
dec_need_kf = Este archivo necesita un archivo de clave.
dec_need_pw = Este archivo necesita una contraseña.
dec_ok = Descifrado: {0} archivo(s), {1}. Comprobación de integridad correcta.
dec_ok_bad = Descifrado, pero la comprobación de integridad (SHA-256) HA FALLADO. El contenido puede estar dañado o modificado.
err_wrongpw = Contraseña o archivo de clave incorrectos.
err_mac = El archivo está dañado o ha sido modificado (falló la autenticación). No se descifró nada.
err_format = No es un archivo SecureEncrypt válido (o está dañado).
err_path = El archivo contiene una ruta no segura y se rechazó.
err_needpw = Introduzca la contraseña (y/o seleccione el archivo de clave).
err_mem = No hay memoria suficiente en el navegador para este archivo.
err_other = Error: {0}
about = Esta aplicación ha sido programada por Abdullah ERTÜRK.<br><a href="https://buymeacoffee.com/abdullaherturk" target="_blank" rel="noopener noreferrer">Invítame a un café</a>
foot = Código abierto. Compatible con SecureEncrypt para Windows (formato SEv2).
items = elementos
; large file mode (written straight to disk, piece by piece)
limit_enc_big = Archivos grandes: los archivos y carpetas de más de 1,5 GB se procesan por partes y se guardan directamente en el archivo que elija; la memoria no es un límite. Sin contraseña ni archivo de clave, el contenido solo se oculta, no se protege.
limit_dec_big = Archivos grandes: un archivo _decrypt.cmd de más de 1,5 GB se descifra por partes y se escribe directamente en la carpeta que elija (no se sobrescriben los archivos existentes; se añade un número al nombre del nuevo).
big_dir_hint = Por una norma del navegador, las carpetas Escritorio, Descargas y Documentos en sí no se pueden elegir; cree dentro de una de ellas una carpeta con «Nueva carpeta» y elíjala, o elija una carpeta existente.
big_on = Modo de archivos grandes: el resultado se guarda directamente en el disco, por lo que se le preguntará dónde guardarlo. Sin contraseña ni archivo de clave, el contenido solo se oculta, no se protege.
big_s1_enc = Paso 1/2: leyendo los datos... {0} %
big_s2_enc = Paso 2/2: cifrando y guardando... {0} %
big_s1_dec = Paso 1/2: comprobando el archivo... {0} %
big_s2_dec = Paso 2/2: descifrando y guardando... {0} %
big_one_dec = Restaurando los archivos... {0} %
cancel = Cancelar
big_cancelled = Cancelado.
big_changed = Un archivo cambió (o no se pudo leer por completo) durante el proceso. No se guardó nada.
big_saved = Guardado como: {0}
