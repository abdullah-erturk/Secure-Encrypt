; SecureEncrypt web page texts - language: English (file name = language code: en.ini)
; To add a language: copy en.ini to <code>.ini here (src\web\web_lang), translate the values, run src\build.ps1.
; One "key = value" per line, UTF-8. Missing keys fall back to English (the build prints a warning).
; Keep the {0} {1} placeholders, the [[SE]] link token and the HTML tags (<b>, <br>, <a ...>) as they are.
; strength = five words separated by |  (from very weak to strong).

lang_name = English
sub = AES-256 encrypt & decrypt in your browser
priv = <b>Nothing leaves your device.</b> Files and passwords are processed locally in this page; no data is uploaded anywhere.
tab_enc = Encrypt
tab_dec = Decrypt
drop_enc = Drop files or folders here
add_files = Add files...
add_dir = Add folder...
clear = Clear
pw = Password (optional)
pw2 = Repeat password
pw_hint = Without a password the content is only obfuscated (compressed + XOR), which is NOT security and only hides plain text.
kf = Key file (optional)
kf_pick = Choose key file...
kf_hint = A key file can be used instead of a password or together with it (two factors). Its content, not its name, is what counts.
btn_enc = Encrypt
btn_dec = Decrypt
strength = Very weak | Weak | Fair | Good | Strong
drop_dec = Drop a *_decrypt.cmd file here
pick_dec = Choose *_decrypt.cmd...
pw_dec = Password
kf_dec = Key file
empty = Add at least one file or folder first.
mismatch = The two passwords are different.
nopw_confirm = No password and no key file: the content will only be obfuscated (not secure). Continue?
limit_enc = Size limit: The files and folders you add can total about 1.5 GB in this page. For larger data use the [[SE]] application written for Windows. Or open this page in Chrome, Edge, Opera or Samsung Internet, which have a large file mode.
limit_dec = Size limit: The _decrypt.cmd file can be about 1.5 GB at most in this page. For larger files use the [[SE]] application written for Windows. Or open this page in Chrome, Edge, Opera or Samsung Internet, which have a large file mode.
too_big = This file is too large for the browser (limit about 1.5 GB in total). This browser does not support large file mode: open this page in Chrome, Edge, Opera or Samsung Internet, or use the [[SE]] application written for Windows.
too_big_dec = This file is too large for the browser (limit about 1.5 GB). This browser does not support large file mode: you can open this page in Chrome, Edge, Opera or Samsung Internet. Or decrypt it with [[SE]] on Windows: right-click it and choose "Decrypt", or choose it on the Decrypt tab of the SecureEncrypt window.
elapsed = Time: {0}
unit_h = h
unit_m = min
unit_s = s
no_stream = This browser lacks the compression API (CompressionStream). Please use a current Chrome, Edge, Firefox or Safari.
no_crypto = The browser cryptography API is not available. Open this page over HTTPS (or from a local file) in a current browser.
home = Home
insecure = This page was opened over an insecure connection (plain http://), so encryption and decryption are switched off by the browser. Open it over https://, as http://localhost, or as a local file.
dir_hint = When you choose a folder, your browser may ask for permission to "upload" it. Your files are NOT uploaded anywhere: this only lets the page read the folder so it can encrypt it on your device.
skipped = NOT included (could not be read; a dropped folder that the browser does not pass on can be added with "Add folder..."): {0}
err_noread = None of the items could be read. For a folder use "Add folder..." instead of dragging it.
working = Working... (deriving the key can take a moment)
enc_done = Done: {0} item(s), {1} -> {2}. Mode: {3}.
mode_aes = AES-256-CBC + HMAC-SHA256
mode_xor = obfuscation only (no password)
enc_note = The file runs on Windows by double-click (a window asks for the password) and can be opened with this page on any device.
keep_open = Do not close the browser or this tab and do not reload the page while the job runs; it would be interrupted and partly written files may be left behind.
enc_note_mid = The file runs on Windows by double-click (a window asks for the password). Because it is over 1.5 GB, this page can open it only with large file mode in Chrome, Edge, Opera or Samsung Internet.
enc_note_big = NOTE: The file is larger than 4 GB; Windows cannot open it by double-click. To decrypt it, right-click the file and choose "Decrypt", or choose it on the Decrypt tab of the SecureEncrypt window. This page can also open it with large file mode in Chrome, Edge, Opera or Samsung Internet.
dl = Download
dl_all = Download all (ZIP)
sanitized = {0} name(s) contained characters Windows does not allow and were changed.
dec_info_aes = Encrypted with AES-256 ({0} iterations).
dec_info_xor = No password: the content is only obfuscated.
dec_need_kf = This file needs a key file.
dec_need_pw = This file needs a password.
dec_ok = Decrypted: {0} file(s), {1}. Integrity check passed.
dec_ok_bad = Decrypted, but the integrity check (SHA-256) FAILED. The content may be damaged or modified.
err_wrongpw = Wrong password or key file.
err_mac = The file is damaged or has been modified (authentication failed). Nothing was decrypted.
err_format = This is not a valid SecureEncrypt file (or it is damaged).
err_path = The file contains an unsafe path and was rejected.
err_needpw = Enter the password (and/or choose the key file).
err_mem = Not enough memory for this file in the browser.
err_other = Error: {0}
about = This application was coded by Abdullah ERTÜRK.<br><a href="https://buymeacoffee.com/abdullaherturk" target="_blank" rel="noopener noreferrer">Buy me a coffee</a>
foot = Open source. Compatible with SecureEncrypt for Windows (SEv2 format).
items = items
; large file mode (written straight to disk, piece by piece)
limit_enc_big = Large files: files and folders over 1.5 GB are processed piece by piece and saved straight to a file you choose, so memory is not a limit. Without a password or key file the content is only hidden, not protected.
limit_dec_big = Large files: a _decrypt.cmd file over 1.5 GB is decrypted piece by piece and written straight into a folder you choose (existing files are not overwritten; a number is added to the new file's name).
big_dir_hint = Because of a browser rule, the Desktop, Downloads and Documents folders themselves cannot be chosen; create a folder inside one of them with "New folder" and choose that, or choose an existing folder.
big_on = Large file mode: the result is saved straight to disk, so you will be asked where to save it. Without a password or key file the content is only hidden, not protected.
big_s1_enc = Step 1/2: reading the data... {0}%
big_s2_enc = Step 2/2: encrypting and saving... {0}%
big_s1_dec = Step 1/2: checking the file... {0}%
big_s2_dec = Step 2/2: decrypting and saving... {0}%
big_one_dec = Restoring the files... {0}%
cancel = Cancel
big_cancelled = Cancelled.
big_changed = A file changed (or could not be read completely) while it was being processed. Nothing was saved.
big_saved = Saved as: {0}
big_saved_dir = The files were written to the folder: {0}
