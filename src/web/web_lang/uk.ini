; SecureEncrypt web page texts - language: Українська (file name = language code: uk.ini)
; To add a language: copy en.ini to <code>.ini here (src\web\web_lang), translate the values, run src\build.ps1.
; One "key = value" per line, UTF-8. Missing keys fall back to English (the build prints a warning).
; Keep the {0} {1} placeholders, the [[SE]] link token and the HTML tags (<b>, <br>, <a ...>) as they are.
; strength = five words separated by |  (from very weak to strong).

lang_name = Українська
sub = Шифрування та розшифрування AES-256 у вашому браузері
priv = <b>Дані не залишають ваш пристрій.</b> Файли та паролі обробляються локально на цій сторінці; нічого нікуди не завантажується.
tab_enc = Зашифрувати
tab_dec = Розшифрувати
drop_enc = Перетягніть сюди файли або папки
add_files = Додати файли...
add_dir = Додати папку...
clear = Очистити
pw = Пароль (необов'язково)
pw2 = Повторіть пароль
pw_hint = Без пароля вміст лише приховується (стиснення + XOR). Це НЕ захист, воно лише ховає відкритий текст.
kf = Файл ключа (необов'язково)
kf_pick = Вибрати файл ключа...
kf_hint = Файл ключа можна використовувати замість пароля або разом із ним (два чинники). Важливий його вміст, а не назва.
btn_enc = Зашифрувати
btn_dec = Розшифрувати
strength = Дуже слабкий | Слабкий | Задовільний | Добрий | Надійний
drop_dec = Перетягніть сюди файл *_decrypt.cmd
pick_dec = Вибрати *_decrypt.cmd...
pw_dec = Пароль
kf_dec = Файл ключа
empty = Спочатку додайте принаймні один файл або папку.
mismatch = Паролі не збігаються.
nopw_confirm = Ні пароля, ні файлу ключа: вміст буде лише приховано (це не безпечно). Продовжити?
limit_enc = Обмеження розміру: загальний розмір доданих файлів і папок на цій сторінці може становити приблизно 1,5 ГБ. Для більших даних скористайтеся програмою [[SE]], написаною для Windows. Або відкрийте цю сторінку в Chrome, Edge, Opera чи Samsung Internet — у них є режим великих файлів.
limit_dec = Обмеження розміру: файл _decrypt.cmd на цій сторінці може бути не більшим за приблизно 1,5 ГБ. Для більших файлів скористайтеся програмою [[SE]], написаною для Windows. Або відкрийте цю сторінку в Chrome, Edge, Opera чи Samsung Internet — у них є режим великих файлів.
too_big = Цей файл завеликий для браузера (загальне обмеження приблизно 1,5 ГБ). Цей браузер не підтримує режим великих файлів: відкрийте цю сторінку в Chrome, Edge, Opera чи Samsung Internet або скористайтеся програмою [[SE]], написаною для Windows.
too_big_dec = Цей файл завеликий для браузера (обмеження приблизно 1,5 ГБ). Цей браузер не підтримує режим великих файлів: можна відкрити цю сторінку в Chrome, Edge, Opera чи Samsung Internet. Або розшифруйте його за допомогою [[SE]] у Windows: клацніть файл правою кнопкою миші та виберіть «Розшифрувати» або виберіть його на вкладці «Розшифрувати» у вікні SecureEncrypt.
elapsed = Час: {0}
unit_h = год
unit_m = хв
unit_s = с
no_stream = У цьому браузері немає API стиснення (CompressionStream). Скористайтеся актуальною версією Chrome, Edge, Firefox або Safari.
no_crypto = API криптографії браузера недоступний. Відкрийте цю сторінку через HTTPS (або як локальний файл) в актуальному браузері.
home = Головна
insecure = Цю сторінку відкрито через незахищене з'єднання (звичайний http://), тому браузер вимкнув шифрування та розшифрування. Відкрийте її через https://, як http://localhost або як локальний файл.
dir_hint = Коли ви вибираєте папку, браузер може попросити дозвіл на «завантаження». Ваші файли НІКУДИ не завантажуються: цей дозвіл лише дає сторінці змогу прочитати папку, щоб зашифрувати її на вашому пристрої.
skipped = НЕ ВКЛЮЧЕНО (не вдалося прочитати; перетягнуту папку, яку браузер не передав, можна додати через «Додати папку...»): {0}
err_noread = Не вдалося прочитати жодного елемента. Для папки скористайтеся «Додати папку...» замість перетягування.
working = Триває обробка... (отримання ключа може зайняти трохи часу)
enc_done = Готово: елементів — {0}, {1} -> {2}. Режим: {3}.
mode_aes = AES-256-CBC + HMAC-SHA256
mode_xor = лише приховування (без пароля)
enc_note = Файл запускається у Windows подвійним клацанням (вікно запитає пароль) і відкривається за допомогою цієї сторінки на будь-якому пристрої.
keep_open = Не закривайте браузер або цю вкладку й не оновлюйте сторінку під час роботи: операцію буде перервано, а недописані файли можуть залишитися.
enc_note_mid = Файл запускається у Windows подвійним клацанням (вікно запитає пароль). Оскільки він більший за 1,5 ГБ, ця сторінка може відкрити його лише в режимі великих файлів у Chrome, Edge, Opera або Samsung Internet.
enc_note_big = УВАГА: файл більший за 4 ГБ; Windows не може відкрити його подвійним клацанням. Щоб розшифрувати, клацніть файл правою кнопкою миші та виберіть «Розшифрувати» або виберіть його на вкладці «Розшифрувати» у вікні SecureEncrypt. Ця сторінка також може відкрити його в режимі великих файлів у Chrome, Edge, Opera або Samsung Internet.
dl = Завантажити
dl_all = Завантажити все (ZIP)
sanitized = Змінено назв: {0} — вони містили символи, недозволені у Windows.
dec_info_aes = Зашифровано за допомогою AES-256 (ітерацій: {0}).
dec_info_xor = Без пароля: вміст лише приховано.
dec_need_kf = Для цього файлу потрібен файл ключа.
dec_need_pw = Для цього файлу потрібен пароль.
dec_ok = Розшифровано: файлів — {0}, {1}. Перевірку цілісності пройдено.
dec_ok_bad = Розшифровано, але перевірку цілісності (SHA-256) НЕ ПРОЙДЕНО. Вміст може бути пошкоджено або змінено.
err_wrongpw = Неправильний пароль або файл ключа.
err_mac = Файл пошкоджено або змінено (автентифікація не пройдена). Нічого не розшифровано.
err_format = Це не дійсний файл SecureEncrypt (або його пошкоджено).
err_path = Файл містить небезпечний шлях і був відхилений.
err_needpw = Введіть пароль (та/або виберіть файл ключа).
err_mem = Недостатньо пам'яті в браузері для цього файлу.
err_other = Помилка: {0}
about = Цю програму створив Abdullah ERTÜRK.<br><a href="https://buymeacoffee.com/abdullaherturk" target="_blank" rel="noopener noreferrer">Пригостити кавою</a>
foot = Відкритий код. Сумісно з SecureEncrypt for Windows (формат SEv2).
items = елементів
; large file mode (written straight to disk, piece by piece)
limit_enc_big = Великі файли: файли й папки понад 1,5 ГБ обробляються частинами та зберігаються прямо у вибраний вами файл; пам'ять не є обмеженням. Без пароля та файлу ключа вміст лише приховується, а не захищається.
limit_dec_big = Великі файли: файл _decrypt.cmd понад 1,5 ГБ розшифровується частинами та записується прямо у вибрану вами папку (наявні файли не перезаписуються; до імені нового файлу додається номер).
big_dir_hint = За правилом браузера не можна вибрати самі папки «Робочий стіл», «Завантаження» та «Документи»; створіть усередині однієї з них папку кнопкою «Нова папка» і виберіть її або виберіть наявну папку.
big_on = Режим великих файлів: результат зберігається прямо на диск, тому вас запитають, куди зберегти. Без пароля та файлу ключа вміст лише приховується, а не захищається.
big_s1_enc = Крок 1/2: читання даних... {0}%
big_s2_enc = Крок 2/2: шифрування та збереження... {0}%
big_s1_dec = Крок 1/2: перевірка файлу... {0}%
big_s2_dec = Крок 2/2: розшифрування та збереження... {0}%
big_one_dec = Відновлення файлів... {0}%
cancel = Скасувати
big_cancelled = Скасовано.
big_changed = Файл змінився (або не був прочитаний повністю) під час обробки. Нічого не збережено.
big_saved = Збережено як: {0}
big_saved_dir = Файли записано в папку: {0}
