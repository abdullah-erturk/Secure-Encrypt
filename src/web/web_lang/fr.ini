; SecureEncrypt web page texts - language: Français (file name = language code: fr.ini)
; To add a language: copy en.ini to <code>.ini here (src\web\web_lang), translate the values, run src\build.ps1.
; One "key = value" per line, UTF-8. Missing keys fall back to English (the build prints a warning).
; Keep the {0} {1} placeholders, the [[SE]] link token and the HTML tags (<b>, <br>, <a ...>) as they are.
; strength = five words separated by |  (from very weak to strong).

lang_name = Français
sub = Chiffrement et déchiffrement AES-256 dans votre navigateur
priv = <b>Rien ne quitte votre appareil.</b> Les fichiers et mots de passe sont traités localement sur cette page ; aucune donnée n’est envoyée.
tab_enc = Chiffrer
tab_dec = Déchiffrer
drop_enc = Déposez les fichiers ou dossiers ici
add_files = Ajouter des fichiers...
add_dir = Ajouter un dossier...
clear = Effacer
pw = Mot de passe (facultatif)
pw2 = Répéter le mot de passe
pw_hint = Sans mot de passe, le contenu est seulement masqué (compression + XOR) ; ce n’est PAS une protection, cela empêche uniquement l’affichage du texte brut.
kf = Fichier clé (facultatif)
kf_pick = Choisir un fichier clé...
kf_hint = Le fichier clé peut remplacer le mot de passe ou être utilisé avec lui (deux facteurs). C’est son contenu, et non son nom, qui compte.
btn_enc = Chiffrer
btn_dec = Déchiffrer
strength = Très faible | Faible | Moyen | Bon | Fort
drop_dec = Déposez ici un fichier *_decrypt.cmd
pick_dec = Choisir *_decrypt.cmd...
pw_dec = Mot de passe
kf_dec = Fichier clé
empty = Ajoutez d’abord au moins un fichier ou un dossier.
mismatch = Les deux mots de passe sont différents.
nopw_confirm = Aucun mot de passe ni fichier clé : le contenu sera seulement masqué (ce n’est pas sécurisé). Continuer ?
limit_enc = Limite de taille : le total des fichiers et dossiers ajoutés sur cette page peut atteindre environ 1,5 Go. Pour des données plus volumineuses, utilisez l’application [[SE]] pour Windows. Ou ouvrez cette page dans Chrome, Edge, Opera ou Samsung Internet, qui disposent d’un mode fichiers volumineux.
limit_dec = Limite de taille : le fichier *_decrypt.cmd peut atteindre environ 1,5 Go au maximum sur cette page. Pour les fichiers plus volumineux, utilisez l’application [[SE]] pour Windows. Ou ouvrez cette page dans Chrome, Edge, Opera ou Samsung Internet, qui disposent d’un mode fichiers volumineux.
too_big = Ce fichier est trop volumineux pour le navigateur (limite totale d’environ 1,5 Go). Ce navigateur ne prend pas en charge le mode fichiers volumineux : ouvrez cette page dans Chrome, Edge, Opera ou Samsung Internet, ou utilisez l’application [[SE]] pour Windows.
too_big_dec = Ce fichier est trop volumineux pour le navigateur (limite d’environ 1,5 Go). Ce navigateur ne prend pas en charge le mode fichiers volumineux : vous pouvez ouvrir cette page dans Chrome, Edge, Opera ou Samsung Internet. Ou déchiffrez-le avec [[SE]] sous Windows : faites un clic droit et choisissez « Déchiffrer », ou sélectionnez-le dans l’onglet Déchiffrer de SecureEncrypt.
elapsed = Durée : {0}
unit_h = h
unit_m = min
unit_s = s
no_stream = Ce navigateur ne dispose pas de l’API de compression (CompressionStream). Veuillez utiliser une version récente de Chrome, Edge, Firefox ou Safari.
no_crypto = L’API cryptographique du navigateur n’est pas disponible. Ouvrez cette page via HTTPS (ou comme fichier local) dans un navigateur récent.
home = Accueil
insecure = Cette page a été ouverte via une connexion non sécurisée (http:// en clair) ; le navigateur a donc désactivé le chiffrement et le déchiffrement. Ouvrez-la via https://, depuis http://localhost ou comme fichier local.
dir_hint = Lorsque vous choisissez un dossier, le navigateur peut demander l’autorisation de le « téléverser ». Vos fichiers ne sont envoyés nulle part : cette autorisation permet uniquement à la page de lire le dossier et de chiffrer les fichiers sur votre appareil.
skipped = NON inclus (lecture impossible ; un dossier déposé que le navigateur ne transmet pas peut être ajouté avec « Ajouter un dossier... ») : {0}
err_noread = Aucun élément n’a pu être lu. Pour un dossier, utilisez « Ajouter un dossier... » au lieu de le faire glisser.
working = Traitement en cours... (la dérivation de la clé peut prendre un instant)
enc_done = Terminé : {0} élément(s), {1} -> {2}. Mode : {3}.
mode_aes = AES-256-CBC + HMAC-SHA256
mode_xor = masquage uniquement (sans mot de passe)
enc_note = Le fichier s’exécute sous Windows par double-clic (une fenêtre demande le mot de passe) et peut être ouvert avec cette page sur tout appareil.
keep_open = Ne fermez pas le navigateur ni cet onglet et ne rechargez pas la page pendant l’opération ; elle serait interrompue et des fichiers partiels pourraient rester.
enc_note_mid = Le fichier s’exécute sous Windows par double-clic (une fenêtre demande le mot de passe). Comme il dépasse 1,5 Go, cette page ne peut l’ouvrir qu’avec le mode fichiers volumineux dans Chrome, Edge, Opera ou Samsung Internet.
enc_note_big = ATTENTION : le fichier dépasse 4 Go ; Windows ne peut pas l’ouvrir par double-clic. Pour le déchiffrer, faites un clic droit sur le fichier et choisissez « Déchiffrer », ou sélectionnez-le dans l’onglet Déchiffrer de la fenêtre SecureEncrypt. Cette page peut aussi l’ouvrir avec le mode fichiers volumineux dans Chrome, Edge, Opera ou Samsung Internet.
dl = Télécharger
dl_all = Tout télécharger (ZIP)
sanitized = {0} nom(s) contenaient des caractères interdits par Windows et ont été modifiés.
dec_info_aes = Chiffré avec AES-256 ({0} itérations).
dec_info_xor = Sans mot de passe : le contenu est seulement masqué.
dec_need_kf = Ce fichier nécessite un fichier clé.
dec_need_pw = Ce fichier nécessite un mot de passe.
dec_ok = Déchiffré : {0} fichier(s), {1}. Vérification d’intégrité réussie.
dec_ok_bad = Déchiffré, mais la vérification d’intégrité (SHA-256) a ÉCHOUÉ. Le contenu peut être endommagé ou modifié.
err_wrongpw = Mot de passe ou fichier clé incorrect.
err_mac = Le fichier est endommagé ou a été modifié (échec de l’authentification). Rien n’a été déchiffré.
err_format = Ce fichier SecureEncrypt n’est pas valide (ou est endommagé).
err_path = Le fichier contient un chemin non sûr et a été refusé.
err_needpw = Saisissez le mot de passe (et/ou choisissez le fichier clé).
err_mem = Mémoire insuffisante dans le navigateur pour ce fichier.
err_other = Erreur : {0}
about = Cette application a été programmée par Abdullah ERTÜRK.<br><a href="https://buymeacoffee.com/abdullaherturk" target="_blank" rel="noopener noreferrer">Offrez-moi un café</a>
foot = Open source. Compatible avec SecureEncrypt pour Windows (format SEv2).
items = éléments
; large file mode (written straight to disk, piece by piece)
limit_enc_big = Fichiers volumineux : les fichiers et dossiers de plus de 1,5 Go sont traités par morceaux et enregistrés directement dans le fichier de votre choix ; la mémoire n'est pas une limite. Sans mot de passe ni fichier de clé, le contenu est seulement masqué, pas protégé.
limit_dec_big = Fichiers volumineux : un fichier _decrypt.cmd de plus de 1,5 Go est déchiffré par morceaux et écrit directement dans le dossier de votre choix (les fichiers existants ne sont pas écrasés ; un numéro est ajouté au nom du nouveau).
big_dir_hint = En raison d’une règle du navigateur, les dossiers Bureau, Téléchargements et Documents eux-mêmes ne peuvent pas être choisis ; créez-y un dossier avec « Nouveau dossier » et choisissez-le, ou choisissez un dossier existant.
big_on = Mode fichiers volumineux : le résultat est enregistré directement sur le disque ; l'emplacement vous sera demandé. Sans mot de passe ni fichier de clé, le contenu est seulement masqué, pas protégé.
big_s1_enc = Étape 1/2 : lecture des données... {0} %
big_s2_enc = Étape 2/2 : chiffrement et enregistrement... {0} %
big_s1_dec = Étape 1/2 : vérification du fichier... {0} %
big_s2_dec = Étape 2/2 : déchiffrement et enregistrement... {0} %
big_one_dec = Restauration des fichiers... {0} %
cancel = Annuler
big_cancelled = Annulé.
big_changed = Un fichier a changé (ou n'a pas pu être lu entièrement) pendant le traitement. Rien n'a été enregistré.
big_saved = Enregistré sous : {0}
big_saved_dir = Les fichiers ont été écrits dans le dossier : {0}
