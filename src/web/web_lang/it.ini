; SecureEncrypt web page texts - language: Italiano (file name = language code: it.ini)
; To add a language: copy en.ini to <code>.ini here (src\web\web_lang), translate the values, run src\build.ps1.
; One "key = value" per line, UTF-8. Missing keys fall back to English (the build prints a warning).
; Keep the {0} {1} placeholders, the [[SE]] link token and the HTML tags (<b>, <br>, <a ...>) as they are.
; strength = five words separated by |  (from very weak to strong).

lang_name = Italiano
sub = Crittografia e decrittografia AES-256 nel browser
priv = <b>Nulla lascia il dispositivo.</b> File e password vengono elaborati localmente in questa pagina; nessun dato viene caricato.
tab_enc = Crittografa
tab_dec = Decrittografa
drop_enc = Trascina qui file o cartelle
add_files = Aggiungi file...
add_dir = Aggiungi cartella...
clear = Cancella
pw = Password (facoltativa)
pw2 = Ripeti password
pw_hint = Senza password il contenuto viene solo offuscato (compressione + XOR): NON è una protezione, impedisce soltanto di visualizzare il testo in chiaro.
kf = File chiave (facoltativo)
kf_pick = Scegli file chiave...
kf_hint = Il file chiave può essere usato al posto della password oppure insieme ad essa (due fattori). Conta il contenuto, non il nome.
btn_enc = Crittografa
btn_dec = Decrittografa
strength = Molto debole | Debole | Discreta | Buona | Forte
drop_dec = Trascina qui un file *_decrypt.cmd
pick_dec = Scegli *_decrypt.cmd...
pw_dec = Password
kf_dec = File chiave
empty = Aggiungi prima almeno un file o una cartella.
mismatch = Le due password non corrispondono.
nopw_confirm = Nessuna password e nessun file chiave: il contenuto sarà solo offuscato (non è sicuro). Continuare?
limit_enc = Limite dimensioni: il totale dei file e delle cartelle aggiunti in questa pagina può essere di circa 1,5 GB al massimo. Per quantità maggiori, usa l’applicazione [[SE]] per Windows. Oppure apri questa pagina in Chrome, Edge, Opera o Samsung Internet, che hanno la modalità file di grandi dimensioni.
limit_dec = Limite dimensioni: il file *_decrypt.cmd può essere grande al massimo circa 1,5 GB in questa pagina. Per file più grandi, usa l’applicazione [[SE]] per Windows. Oppure apri questa pagina in Chrome, Edge, Opera o Samsung Internet, che hanno la modalità file di grandi dimensioni.
too_big = Questo file è troppo grande per il browser (limite totale di circa 1,5 GB). Questo browser non supporta la modalità file di grandi dimensioni: apri questa pagina in Chrome, Edge, Opera o Samsung Internet, oppure usa l’applicazione [[SE]] per Windows.
too_big_dec = Questo file è troppo grande per il browser (limite di circa 1,5 GB). Questo browser non supporta la modalità file di grandi dimensioni: puoi aprire questa pagina in Chrome, Edge, Opera o Samsung Internet. Oppure decrittografalo con [[SE]] su Windows: fai clic destro e scegli «Decrittografa», oppure selezionalo nella scheda Decrittografa di SecureEncrypt.
elapsed = Tempo: {0}
unit_h = h
unit_m = min
unit_s = s
no_stream = Questo browser non supporta l’API di compressione (CompressionStream). Usa una versione aggiornata di Chrome, Edge, Firefox o Safari.
no_crypto = L’API crittografica del browser non è disponibile. Apri questa pagina tramite HTTPS (o come file locale) in un browser aggiornato.
home = Home
insecure = Questa pagina è stata aperta tramite una connessione non sicura (http:// non crittografato), quindi il browser ha disattivato crittografia e decrittografia. Aprila tramite https://, come http://localhost o come file locale.
dir_hint = Quando scegli una cartella, il browser potrebbe chiedere il permesso di «caricarla». I file NON vengono caricati da nessuna parte: il permesso consente solo alla pagina di leggere la cartella e crittografare i file sul dispositivo.
skipped = NON incluso (impossibile leggere; una cartella trascinata che il browser non trasmette può essere aggiunta con «Aggiungi cartella...»): {0}
err_noread = Non è stato possibile leggere alcun elemento. Per una cartella usa «Aggiungi cartella...» invece di trascinarla.
working = Elaborazione... (la derivazione della chiave può richiedere qualche istante)
enc_done = Completato: {0} elemento/i, {1} -> {2}. Modalità: {3}.
mode_aes = AES-256-CBC + HMAC-SHA256
mode_xor = solo offuscamento (senza password)
enc_note = Il file si avvia su Windows con un doppio clic (una finestra chiede la password) e può essere aperto con questa pagina su qualsiasi dispositivo.
keep_open = Non chiudere il browser né questa scheda e non ricaricare la pagina durante l’operazione; verrebbe interrotta e potrebbero restare file scritti a metà.
enc_note_mid = Il file si avvia su Windows con un doppio clic (una finestra chiede la password). Poiché supera 1,5 GB, questa pagina può aprirlo solo con la modalità file di grandi dimensioni in Chrome, Edge, Opera o Samsung Internet.
enc_note_big = ATTENZIONE: il file supera i 4 GB; Windows non può aprirlo con un doppio clic. Per decrittografarlo, fai clic destro sul file e scegli «Decrittografa», oppure selezionalo nella scheda Decrittografa della finestra di SecureEncrypt. Questa pagina può aprirlo anche con la modalità file di grandi dimensioni in Chrome, Edge, Opera o Samsung Internet.
dl = Scarica
dl_all = Scarica tutto (ZIP)
sanitized = {0} nome/i contenevano caratteri non consentiti da Windows e sono stati modificati.
dec_info_aes = Crittografato con AES-256 ({0} iterazioni).
dec_info_xor = Nessuna password: il contenuto è solo offuscato.
dec_need_kf = Questo file richiede un file chiave.
dec_need_pw = Questo file richiede una password.
dec_ok = Decrittografato: {0} file, {1}. Controllo di integrità superato.
dec_ok_bad = Decrittografato, ma il controllo di integrità (SHA-256) NON È RIUSCITO. Il contenuto potrebbe essere danneggiato o modificato.
err_wrongpw = Password o file chiave errati.
err_mac = Il file è danneggiato o è stato modificato (autenticazione non riuscita). Non è stato decrittografato nulla.
err_format = Questo non è un file SecureEncrypt valido (oppure è danneggiato).
err_path = Il file contiene un percorso non sicuro ed è stato rifiutato.
err_needpw = Inserisci la password (e/o seleziona il file chiave).
err_mem = Memoria insufficiente nel browser per questo file.
err_other = Errore: {0}
about = Questa applicazione è stata programmata da Abdullah ERTÜRK.<br><a href="https://buymeacoffee.com/abdullaherturk" target="_blank" rel="noopener noreferrer">Offrimi un caffè</a>
foot = Open source. Compatibile con SecureEncrypt per Windows (formato SEv2).
items = elementi
; large file mode (written straight to disk, piece by piece)
limit_enc_big = File di grandi dimensioni: file e cartelle oltre 1,5 GB vengono elaborati a blocchi e salvati direttamente nel file scelto; la memoria non è un limite. Senza password né file chiave il contenuto viene solo nascosto, non protetto.
limit_dec_big = File di grandi dimensioni: un file _decrypt.cmd oltre 1,5 GB viene decrittografato a blocchi e scritto direttamente nella cartella scelta (i file esistenti non vengono sovrascritti; al nome del nuovo file viene aggiunto un numero).
big_dir_hint = Per una regola del browser, le cartelle Desktop, Download e Documenti non possono essere scelte direttamente; crea al loro interno una cartella con «Nuova cartella» e scegli quella, oppure scegli una cartella esistente.
big_on = Modalità file di grandi dimensioni: il risultato viene salvato direttamente sul disco, quindi verrà chiesto dove salvarlo. Senza password né file chiave il contenuto viene solo nascosto, non protetto.
