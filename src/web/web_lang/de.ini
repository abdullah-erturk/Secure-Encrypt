; SecureEncrypt web page texts - language: Deutsch (file name = language code: de.ini)
; To add a language: copy en.ini to <code>.ini here (src\web\web_lang), translate the values, run src\build.ps1.
; One "key = value" per line, UTF-8. Missing keys fall back to English (the build prints a warning).
; Keep the {0} {1} placeholders, the [[SE]] link token and the HTML tags (<b>, <br>, <a ...>) as they are.
; strength = five words separated by |  (from very weak to strong).

lang_name = Deutsch
sub = AES-256-Verschlüsselung und -Entschlüsselung in Ihrem Browser
priv = <b>Nichts verlässt Ihr Gerät.</b> Dateien und Passwörter werden lokal auf dieser Seite verarbeitet; es werden keinerlei Daten irgendwohin hochgeladen.
tab_enc = Verschlüsseln
tab_dec = Entschlüsseln
drop_enc = Dateien oder Ordner hier ablegen
add_files = Dateien hinzufügen...
add_dir = Ordner hinzufügen...
clear = Leeren
pw = Passwort (optional)
pw2 = Passwort wiederholen
pw_hint = Ohne Passwort wird der Inhalt nur verborgen (Komprimierung + XOR); das bietet keine Sicherheit, sondern verhindert lediglich, dass Klartext sichtbar ist.
kf = Schlüsseldatei (optional)
kf_pick = Schlüsseldatei auswählen...
kf_hint = Die Schlüsseldatei kann anstelle eines Passworts oder zusammen mit einem Passwort (Zwei-Faktor-Verfahren) verwendet werden. Entscheidend ist der Inhalt, nicht der Dateiname.
btn_enc = Verschlüsseln
btn_dec = Entschlüsseln
strength = Sehr schwach | Schwach | Mittel | Gut | Stark
drop_dec = *_decrypt.cmd-Datei hier ablegen
pick_dec = *_decrypt.cmd auswählen...
pw_dec = Passwort
kf_dec = Schlüsseldatei
empty = Fügen Sie zuerst mindestens eine Datei oder einen Ordner hinzu.
mismatch = Die beiden Passwörter stimmen nicht überein.
nopw_confirm = Kein Passwort und keine Schlüsseldatei: Der Inhalt wird nur verborgen (nicht sicher). Möchten Sie fortfahren?
limit_enc = Größenbeschränkung: Die Gesamtgröße der auf dieser Seite hinzugefügten Dateien und Ordner darf ungefähr 1,5 GB nicht überschreiten. Für größere Datenmengen verwenden Sie die für Windows entwickelte [[SE]]-Anwendung. Oder öffnen Sie diese Seite in Chrome, Edge, Opera oder Samsung Internet, die einen Modus für große Dateien haben.
limit_dec = Größenbeschränkung: Die *_decrypt.cmd-Datei darf auf dieser Seite höchstens ungefähr 1,5 GB groß sein. Für größere Dateien verwenden Sie die für Windows entwickelte [[SE]]-Anwendung. Oder öffnen Sie diese Seite in Chrome, Edge, Opera oder Samsung Internet, die einen Modus für große Dateien haben.
too_big = Diese Datei ist für den Browser zu groß (Gesamtgrenze: ungefähr 1,5 GB). Dieser Browser unterstützt den Modus für große Dateien nicht: Öffnen Sie diese Seite in Chrome, Edge, Opera oder Samsung Internet oder verwenden Sie die für Windows entwickelte [[SE]]-Anwendung.
too_big_dec = Diese Datei ist für den Browser zu groß (Grenze: ungefähr 1,5 GB). Dieser Browser unterstützt den Modus für große Dateien nicht: Sie können diese Seite in Chrome, Edge, Opera oder Samsung Internet öffnen. Oder verwenden Sie die für Windows entwickelte [[SE]]-Anwendung: Klicken Sie mit der rechten Maustaste auf die Datei und wählen Sie „Entschlüsseln“, oder wählen Sie sie auf der Registerkarte „Entschlüsseln“ im SecureEncrypt-Fenster aus.
elapsed = Dauer: {0}
unit_h = Std.
unit_m = Min.
unit_s = Sek.
no_stream = Die Komprimierungs-API (CompressionStream) ist in diesem Browser nicht verfügbar. Bitte verwenden Sie eine aktuelle Version von Chrome, Edge, Firefox oder Safari.
no_crypto = Die Verschlüsselungs-API des Browsers ist nicht verfügbar. Öffnen Sie diese Seite in einem aktuellen Browser über HTTPS (oder als lokale Datei).
home = Startseite
insecure = Da diese Seite über eine unsichere Verbindung (unverschlüsseltes http://) geöffnet wurde, hat der Browser die Verschlüsselung und Entschlüsselung deaktiviert. Öffnen Sie die Seite über https://, als http://localhost oder als lokale Datei.
dir_hint = Wenn Sie einen Ordner auswählen, bittet der Browser möglicherweise um die Berechtigung zum „Hochladen“. Ihre Dateien werden nirgendwohin hochgeladen: Diese Berechtigung ermöglicht der Seite lediglich, den Ordner zu lesen und die Dateien auf Ihrem Gerät zu verschlüsseln.
skipped = NICHT EINBEZOGEN (konnte nicht gelesen werden; ein Ordner, der per Drag-and-drop abgelegt, aber vom Browser nicht übermittelt wurde, kann über „Ordner hinzufügen...“ hinzugefügt werden): {0}
err_noread = Es konnten keine Elemente gelesen werden. Verwenden Sie für Ordner „Ordner hinzufügen...“, anstatt sie per Drag-and-drop abzulegen.
working = Wird verarbeitet... (Die Schlüsselableitung kann etwas dauern)
enc_done = Fertig: {0} Elemente, {1} -> {2}. Modus: {3}.
mode_aes = AES-256-CBC + HMAC-SHA256
mode_xor = nur verborgen (ohne Passwort)
enc_note = Die Datei kann unter Windows per Doppelklick ausgeführt (ein Fenster fragt nach dem Passwort) und auf jedem Gerät mit dieser Seite geöffnet werden.
keep_open = Schließen Sie den Browser oder diesen Tab nicht und laden Sie die Seite nicht neu, solange der Vorgang läuft; er würde abgebrochen und es könnten unvollständige Dateien zurückbleiben.
enc_note_mid = Die Datei kann unter Windows per Doppelklick ausgeführt werden (ein Fenster fragt nach dem Passwort). Da sie größer als 1,5 GB ist, lässt sie sich mit dieser Seite nur im Modus für große Dateien in Chrome, Edge, Opera oder Samsung Internet öffnen.
enc_note_big = HINWEIS: Die Datei ist größer als 4 GB; Windows kann sie nicht per Doppelklick öffnen. Zum Entschlüsseln klicken Sie mit der rechten Maustaste auf die Datei und wählen „Entschlüsseln“, oder wählen Sie sie auf der Registerkarte „Entschlüsseln“ im SecureEncrypt-Fenster. Diese Seite kann sie auch mit dem Modus für große Dateien in Chrome, Edge, Opera oder Samsung Internet öffnen.
dl = Herunterladen
dl_all = Alles herunterladen (ZIP)
sanitized = Bei {0} Namen waren Zeichen enthalten, die Windows nicht zulässt; sie wurden geändert.
dec_info_aes = Mit AES-256 verschlüsselt ({0} Iterationen).
dec_info_xor = Kein Passwort: Der Inhalt wurde nur verborgen.
dec_need_kf = Für diese Datei wird eine Schlüsseldatei benötigt.
dec_need_pw = Für diese Datei wird ein Passwort benötigt.
dec_ok = Entschlüsselt: {0} Dateien, {1}. Integritätsprüfung bestanden.
dec_ok_bad = Entschlüsselt, aber die Integritätsprüfung (SHA-256) ist FEHLGESCHLAGEN. Der Inhalt könnte beschädigt oder verändert worden sein.
err_wrongpw = Passwort oder Schlüsseldatei ist falsch.
err_mac = Die Datei ist beschädigt oder wurde verändert (Authentifizierung fehlgeschlagen). Es wurde nichts entschlüsselt.
err_format = Dies ist keine gültige SecureEncrypt-Datei (oder sie ist beschädigt).
err_path = Die Datei enthält einen unsicheren Pfad und wurde abgewiesen.
err_needpw = Geben Sie das Passwort ein (und/oder wählen Sie die Schlüsseldatei aus).
err_mem = Für diese Datei ist im Browser nicht genügend Arbeitsspeicher verfügbar.
err_other = Fehler: {0}
about = Diese Anwendung wurde von Abdullah ERTÜRK programmiert.<br><a href="https://buymeacoffee.com/abdullaherturk" target="_blank" rel="noopener noreferrer">Einen Kaffee spendieren</a>
foot = Open Source. Kompatibel mit SecureEncrypt for Windows (SEv2-Format).
items = Elemente
; large file mode (written straight to disk, piece by piece)
limit_enc_big = Große Dateien: Dateien und Ordner über 1,5 GB werden stückweise verarbeitet und direkt in eine von Ihnen gewählte Datei gespeichert; der Arbeitsspeicher ist keine Grenze. Ohne Passwort oder Schlüsseldatei wird der Inhalt nur verborgen, nicht geschützt.
limit_dec_big = Große Dateien: Eine _decrypt.cmd-Datei über 1,5 GB wird stückweise entschlüsselt und direkt in einen von Ihnen gewählten Ordner geschrieben (vorhandene Dateien werden nicht überschrieben; dem Namen der neuen Datei wird eine Nummer angehängt).
big_dir_hint = Aufgrund einer Browser-Regel können die Ordner Desktop, Downloads und Dokumente selbst nicht ausgewählt werden; erstellen Sie darin mit „Neuer Ordner“ einen Ordner und wählen Sie diesen aus, oder wählen Sie einen vorhandenen Ordner.
big_on = Große-Dateien-Modus: Das Ergebnis wird direkt auf die Festplatte gespeichert; Sie werden nach dem Speicherort gefragt. Ohne Passwort oder Schlüsseldatei wird der Inhalt nur verborgen, nicht geschützt.
big_s1_enc = Schritt 1/2: Daten werden gelesen... {0} %
big_s2_enc = Schritt 2/2: Verschlüsseln und Speichern... {0} %
big_s1_dec = Schritt 1/2: Datei wird geprüft... {0} %
big_s2_dec = Schritt 2/2: Entschlüsseln und Speichern... {0} %
big_one_dec = Dateien werden wiederhergestellt... {0} %
cancel = Abbrechen
big_cancelled = Abgebrochen.
big_changed = Eine Datei hat sich während der Verarbeitung geändert (oder konnte nicht vollständig gelesen werden). Es wurde nichts gespeichert.
big_saved = Gespeichert als: {0}
big_saved_dir = Die Dateien wurden in den Ordner geschrieben: {0}
