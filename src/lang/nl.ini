; SecureEncrypt-taalbestand (taalcode = bestandsnaam: en.ini, tr.ini, de.ini, enz.)
; Een taal toevoegen: kopieer en.ini naar <code>.ini, vertaal de waarden en voer src\build.ps1 uit.
; De tekst vóór het "="teken is de sleutel (deze mag niet worden gewijzigd); alleen de waarde moet worden vertaald.
; Waarden waarbij spaties aan het begin of einde behouden moeten blijven, staan ​​tussen aanhalingstekens.
; {0} en {1} worden door het programma ingevuld. "|" geeft een nieuwe regel aan. De backslash wordt als een gewoon teken behandeld.
; Sleutels die in dit bestand ontbreken, worden overgenomen uit en.ini.

