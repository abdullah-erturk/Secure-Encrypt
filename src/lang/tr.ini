; SecureEncrypt dil dosyasi  (dil kodu = dosya adi: en.ini, tr.ini, de.ini ...)
; Yeni dil eklemek icin: en.ini dosyasini <kod>.ini olarak kopyalayin, degerleri cevirin, src\build.ps1 calistirin.
; "=" isaretinden onceki metin anahtardir (degistirmeyin); yalnizca deger cevrilir.
; Basinda veya sonunda bosluk kalmasi gereken deger "cift tirnak" icine alinir.
; {0} {1} programca doldurulur. "|" yeni satir baslatir. Ters bolu (\) normal bir karakterdir.
; Burada olmayan anahtarlar en.ini dosyasindan alinir.

