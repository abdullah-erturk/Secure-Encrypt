; SecureEncrypt-Sprachdatei (Sprachcode = Dateiname: en.ini, tr.ini, de.ini ...)
; Um eine Sprache hinzuzufügen: Kopieren Sie en.ini in <code>.ini, übersetzen Sie die Werte und führen Sie src\build.ps1 aus.
; Der Text vor dem „=“-Zeichen ist der Schlüssel (dieser darf nicht geändert werden); nur der Wert wird übersetzt.
; Werte, bei denen Leerzeichen am Anfang oder Ende erhalten bleiben müssen, werden in „Anführungszeichen“ gesetzt.
; {0} und {1} werden vom Programm ausgefüllt. „|“ leitet eine neue Zeile ein. Der Backslash ist ein normales Zeichen.
; Schlüssel, die hier fehlen, werden aus der en.ini übernommen.

