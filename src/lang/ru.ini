; Файл локализации SecureEncrypt (код языка = имя файла: en.ini, tr.ini, de.ini...)
; Чтобы добавить язык: скопируйте en.ini в <code>.ini, переведите значения и запустите src\build.ps1.
; Текст перед символом «=» — это ключ (его изменять нельзя); переводить нужно только значение.
; Значения, в которых необходимо сохранить пробелы в начале или конце, заключаются в кавычки.
; {0} и {1} заполняются программой. Символ «|» обозначает переход на новую строку. Обратная косая черта («\») является обычным символом.
; Ключи, отсутствующие в данном файле, будут взяты из en.ini.

