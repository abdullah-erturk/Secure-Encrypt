; Archivo de idioma de SecureEncrypt (código de idioma = nombre del archivo: en.ini, tr.ini, de.ini...)
; Para añadir un idioma: copie en.ini a <code>.ini, traduzca los valores y ejecute src\build.ps1.
; El texto antes del signo «=» es la clave (no debe modificarse); solo se traduce el valor.
; Los valores que requieran conservar espacios al principio o al final deben ir entre comillas.
; {0} y {1} son rellenados por el programa. «|» indica un salto de línea. La barra invertida (\) es un carácter normal.
; Las claves que no aparezcan aquí se tomarán de en.ini.

