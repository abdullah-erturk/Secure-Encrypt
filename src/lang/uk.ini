; Файл мови SecureEncrypt (код мови = назва файлу: en.ini, tr.ini, de.ini тощо)
; Щоб додати мову: скопіюйте en.ini у <code>.ini, перекладіть значення та запустіть src\build.ps1.
; Текст перед знаком «=» — це ключ (його змінювати не можна); перекладати слід лише значення.
; Значення, у яких потрібно зберегти пробіли на початку або в кінці, беруться в лапки.
; {0} та {1} заповнюються програмою. Символ «|» позначає перехід на новий рядок. Зворотна скісна риска («\») сприймається як звичайний символ.
; Ключі, відсутні в цьому файлі, будуть успадковані з en.ini.

