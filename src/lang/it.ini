; File lingua di SecureEncrypt (codice lingua = nome file: en.ini, tr.ini, de.ini ...)
; Per aggiungere una lingua: copiare en.ini in <code>.ini, tradurre i valori ed eseguire src\build.ps1.
; Il testo prima del segno "=" è la chiave (non deve essere modificata); va tradotto solo il valore.
; I valori che richiedono il mantenimento di spazi all'inizio o alla fine devono essere racchiusi tra virgolette.
; {0} e {1} vengono compilati dal programma. Il carattere "|" indica una nuova riga. Il backslash è un carattere normale.
; Le chiavi mancanti in questo file verranno recuperate da en.ini.

