; Fichier de langue SecureEncrypt (code langue = nom du fichier : en.ini, tr.ini, de.ini...)
; Pour ajouter une langue : copiez en.ini sous le nom <code>.ini, traduisez les valeurs et exécutez src\build.ps1.
; Le texte situé avant le signe « = » est la clé (elle ne doit pas être modifiée) ; seule la valeur doit être traduite.
; Les valeurs devant conserver des espaces au début ou à la fin doivent être placées entre guillemets.
; {0} et {1} sont remplacés par le programme. Le caractère « | » indique un saut de ligne. Le caractère « \ » (antislash) est considéré comme un caractère ordinaire.
; Les clés absentes ici seront reprises depuis le fichier en.ini.

