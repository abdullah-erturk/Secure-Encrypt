; SecureEncrypt language file  (language code = file name: en.ini, tr.ini, de.ini ...)
; To add a language: copy en.ini to <code>.ini, translate the values, run src\build.ps1.
; The text before "=" is the key (do not change it); only the value is translated.
; A value that must keep spaces at its start or end is wrapped in "double quotes".
; {0} {1} are filled in by the program. "|" starts a new line. Backslash is a normal character.
; Keys that are missing here fall back to en.ini.

